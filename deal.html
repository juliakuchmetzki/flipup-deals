<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>FlipUp Deals – Deal ansehen</title>
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/inter.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f5; color: #111; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: #fff; border-bottom: 1px solid #e5e5e5;
      padding: 0 2rem; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
    .logo-name { font-weight: 700; font-size: 16px; color: #111; }
    .logo-name span { color: #9d0208; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .product-img {
      width: 100%;
      max-height: 220px;
      object-fit: contain;
      margin-bottom: 1.25rem;
      border-radius: 8px;
      background: #f9f9f9;
      padding: 1rem;
    }

    .product-title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 1rem;
      color: #111;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .price {
      font-size: 1.75rem;
      font-weight: 700;
      color: #111;
    }

    .old-price {
      font-size: 14px;
      color: #aaa;
      text-decoration: line-through;
    }

    .discount {
      font-size: 12px;
      font-weight: 600;
      background: #fef2f2;
      color: #9d0208;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .btn-alza {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #0055a5;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.12s;
      margin-bottom: 0.75rem;
    }
    .btn-alza:hover { background: #00408a; }

    .disclosure {
      font-size: 11px;
      color: #999;
      text-align: center;
      line-height: 1.6;
      border-top: 1px solid #f0f0f0;
      padding-top: 1rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #999;
      text-decoration: none;
      margin-bottom: 1rem;
    }
    .back-link:hover { color: #111; }

    .loading { text-align: center; padding: 3rem; color: #999; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo">
    <img src="/flipuplogo.webp" alt="FlipUp" />
    <div class="logo-name">FlipUp <span>Deals</span></div>
  </a>
</header>

<main>
  <div class="card" id="card">
    <div class="loading">Deal wird geladen...</div>
  </div>
</main>

<script>
  const escapeHtml = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const eur = new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR'});
  const safeUrl = v => { try { const u = new URL(v); return (u.protocol === 'https:' || u.protocol === 'http:') ? String(v) : ''; } catch { return ''; } };

  async function loadDeal() {
    const params = new URLSearchParams(window.location.search);
    const asin = params.get('asin');

    // Deal aus API laden
    let deal = null;
    try {
      const r = await fetch('https://api.flipup-deals.de/api/deals.json');
      if (r.ok) {
        const deals = await r.json();
        if (asin && asin !== 'null') {
          deal = deals.find(d => d.asin === asin);
        }
      }
    } catch {}

    // Shop-Deal: direkt weiterleiten
    if (deal?.shop && safeUrl(deal?.url)) {
      window.location.href = deal.url;
      return;
    }

    // Kein Shop-Deal (und kein Alza-Link): zurück zur Startseite
    if (!safeUrl(deal?.alza_link)) {
      window.location.replace('/');
      return;
    }

    const title    = deal.title || 'Angebot ansehen';
    // Rabatt nur, wenn der alte Preis höher ist (und auf mind. 1 % gerundet)
    const pct      = (typeof deal.oldPrice === 'number' && typeof deal.price === 'number' && deal.oldPrice > deal.price) ? Math.round((1 - deal.price / deal.oldPrice) * 100) : 0;
    const price    = deal.price ? eur.format(deal.price) : null;
    const oldPrice = pct >= 1 ? eur.format(deal.oldPrice) : null;
    const image    = safeUrl(deal.image) || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23f5f5f5%22/></svg>';
    const alzaLink = deal.alza_link;

    document.title = `${title.substring(0, 60)} – FlipUp Deals`;

    const disclosureAlza = ' Für Alza-Links gilt eine Affiliate-Partnerschaft.';

    document.getElementById('card').innerHTML = `
      <a href="/" class="back-link">← Zurück zu allen Deals</a>
      <img class="product-img" src="${escapeHtml(image)}" alt="${escapeHtml(title)}"
        onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23f5f5f5%22/></svg>'" />
      <div class="product-title">${escapeHtml(title)}</div>
      ${price ? `
      <div class="price-row">
        <div class="price">${escapeHtml(price)}</div>
        ${oldPrice ? `<div class="old-price">${escapeHtml(oldPrice)}</div>` : ''}
        ${pct >= 1 ? `<div class="discount">−${pct}&nbsp;%</div>` : ''}
      </div>` : ''}

      <a class="btn-alza" href="${escapeHtml(alzaLink)}" target="_blank" rel="nofollow sponsored">
        🔵 Bei Alza ansehen →
      </a>

      <div class="disclosure">
        * Werbung: Bei einem Kauf über Affiliate-Links erhalten wir eine Provision.${disclosureAlza}
        Für dich entstehen keine Mehrkosten.
      </div>
    `;
  }

  loadDeal();
</script>

</body>
</html>
